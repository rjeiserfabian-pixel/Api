# ============================================================================================================
# Apache 2.4: configuracion de ejemplo para PRODUCCION (probada en Apache; ver docs/DESPLIEGUE.md)
#
# Reemplace:   midominio.com            -> su dominio
#              /var/www/api-sunat       -> la carpeta donde puso el proyecto
#              php7.4-fpm.sock          -> el socket de su PHP-FPM (ls /run/php/)
#              rutas de los certificados -> las que cree certbot (/etc/letsencrypt/live/<dominio>/)
#
# Disposicion (dos nombres, un solo proyecto):
#   www.midominio.com   -> pagina publica (carpeta web/): promocion, planes, contacto y VERIFICACION de documentos
#   api.midominio.com   -> la API (/v1), el portal de clientes (/portal), el panel del operador (/operador) y /docs
#   127.0.0.1:8081      -> motor interno (solo visible desde el propio servidor; lo usa la API, nunca Internet)
#
# Modulos necesarios:  a2enmod rewrite headers ssl proxy proxy_fcgi setenvif && systemctl reload apache2
# ============================================================================================================

# --- Puerto interno SOLO para el motor (API_INTERNAL_URL=http://127.0.0.1:8081 en .env) -------------------
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    ServerName motor.interno
    DocumentRoot /var/www/api-sunat
    <Directory /var/www/api-sunat>
        AllowOverride All
        Require local
        Options -Indexes
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php7.4-fpm.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/api-sunat-motor-error.log
</VirtualHost>

# --- HTTP -> HTTPS (todo) -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName api.midominio.com
    ServerAlias www.midominio.com midominio.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# --- API, portal, panel del operador y documentacion ---------------------------------------------------
<VirtualHost *:443>
    ServerName api.midominio.com
    DocumentRoot /var/www/api-sunat

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/api.midominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.midominio.com/privkey.pem

    <Directory /var/www/api-sunat>
        # imprescindible: los .htaccess del proyecto bloquean carpetas y archivos sensibles
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php7.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    ServerSignature Off
    # 4 MB (la API acepta cuerpos de hasta 3 MB)
    LimitRequestBody 4194304
    # SUNAT puede tardar: la API espera hasta ~100 s al motor
    TimeOut 120

    ErrorLog  ${APACHE_LOG_DIR}/api-sunat-error.log
    CustomLog ${APACHE_LOG_DIR}/api-sunat-access.log combined
</VirtualHost>

# --- Pagina publica (carpeta web/) -----------------------------------------------------------------------
<VirtualHost *:443>
    ServerName www.midominio.com
    ServerAlias midominio.com
    DocumentRoot /var/www/api-sunat/web

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/www.midominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.midominio.com/privkey.pem

    <Directory /var/www/api-sunat/web>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php7.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    Header always set Strict-Transport-Security "max-age=31536000"
    ServerSignature Off
    # el formulario de contacto no necesita mas
    LimitRequestBody 65536

    # midominio.com -> www.midominio.com
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^midominio\.com$ [NC]
    RewriteRule ^ https://www.midominio.com%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/api-sunat-web-error.log
    CustomLog ${APACHE_LOG_DIR}/api-sunat-web-access.log combined
</VirtualHost>
