# ============================================================================================================
# Nginx + PHP-FPM: configuracion de REFERENCIA.
#
# ATENCION: este proyecto se desarrollo y se probo con APACHE. Apache lee los archivos .htaccess del proyecto (que bloquean
# carpetas sensibles y enrutan las peticiones); Nginx NO los lee, asi que aqui hay que repetir esas reglas a mano.
# Esta plantilla NO ha sido probada: si la usa, ejecute despues  php bin/verificar.php --produccion  (comprueba por red que
# .env, la base de datos, los logs y el codigo no se pueden descargar) y las pruebas docs/probar*.php.
# Si no tiene razones para usar Nginx, use Apache con deploy/apache-sitios.conf.
# ============================================================================================================

# Motor interno (solo desde el propio servidor): API_INTERNAL_URL=http://127.0.0.1:8081
server {
    listen 127.0.0.1:8081;
    root /var/www/api-sunat;
    include /etc/nginx/snippets/api-sunat-bloqueos.conf;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/php7.4-fpm.sock; }
}

server {
    listen 80;
    server_name api.midominio.com www.midominio.com midominio.com;
    return 301 https://$host$request_uri;
}

# --- API, portal, panel del operador y documentacion ---
server {
    listen 443 ssl http2;
    server_name api.midominio.com;
    ssl_certificate     /etc/letsencrypt/live/api.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.midominio.com/privkey.pem;
    root /var/www/api-sunat;
    client_max_body_size 4m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/api-sunat-bloqueos.conf;

    # API v1: todo entra por v1/index.php (y se pasa la cabecera Authorization)
    location /v1/ { try_files $uri /v1/index.php?$query_string; }
    # Portal de clientes, panel del operador: todo entra por su index.php (salvo /assets/)
    location /portal/   { try_files $uri /portal/index.php?$query_string; }
    location /operador/ { try_files $uri /operador/index.php?$query_string; }
    location ~ ^/(portal|operador)/assets/ { try_files $uri =404; }
    # Comprobantes (solo XML, CDR, PDF y PNG)
    location /files/ { location ~* \.(xml|zip|pdf|png)$ { try_files $uri =404; } location ~ { return 404; } }
    location /docs/ { try_files $uri $uri/ =404; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 120s;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }
    location / { return 404; }
}

# --- Pagina publica (carpeta web/) ---
server {
    listen 443 ssl http2;
    server_name www.midominio.com;
    ssl_certificate     /etc/letsencrypt/live/www.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.midominio.com/privkey.pem;
    root /var/www/api-sunat/web;
    client_max_body_size 64k;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/(views|src)/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files /index.php =404; fastcgi_pass unix:/run/php/php7.4-fpm.sock; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/index.php; }
}
server { listen 443 ssl http2; server_name midominio.com; ssl_certificate /etc/letsencrypt/live/www.midominio.com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/www.midominio.com/privkey.pem; return 301 https://www.midominio.com$request_uri; }

